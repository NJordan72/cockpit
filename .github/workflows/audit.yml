# Checks every package in bun.lock, not only the direct dependencies, against
# the npm advisory database, and fails on a high or critical advisory. It runs
# weekly as well as on changes, because an advisory can be published for a
# package this repository already uses.
name: audit

on:
  push:
    branches: [main]
  pull_request:
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Reads bun.lock directly, so there's no install step.
      - run: bun audit --audit-level=high
