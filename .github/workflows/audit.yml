# Checks every package in bun.lock, not only the direct dependencies, against
# the npm advisory database, and fails on a high or critical advisory. It runs
# weekly as well as on changes, because an advisory can be published for a
# package this repository already uses.
name: audit

on:
  push:
    branches: [main]
  pull_request:
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the bun and Node versions in mise.toml.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # Reads bun.lock directly, so there's no install step.
      - run: bun audit --audit-level=high
