<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shortcut Stories</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sc">
      <header class="sc-head">
        <span class="sc-title">SHORTCUT</span>
        <span class="sc-count" id="count">--</span>
        <span class="sc-spacer"></span>
        <span class="sc-age" id="age" title="Sync now">...</span>
        <span class="sc-dot" id="dot"></span>
        <button
          class="sc-gear"
          id="spin"
          title="Spin the wheel: start a random story from this tab in a new session"
          disabled
        >
          &#127920;
        </button>
        <button class="sc-gear" id="gear" title="Settings">&#9881;</button>
      </header>

      <div class="sc-query" id="queryForm" hidden>
        <label class="sc-label" for="queryInput">Your stories ({me} = you)</label>
        <input id="queryInput" spellcheck="false" autocomplete="off" />
        <label class="sc-label" for="tabsInput">More tabs, one per line: Label = search</label>
        <textarea id="tabsInput" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <label class="sc-label" for="startInput">Start story sends ({id}, {name}, {url})</label>
        <input id="startInput" spellcheck="false" autocomplete="off" />
        <div class="sc-query-row">
          <span class="sc-hint">Enter saves.</span>
          <button type="button" id="queryReset">reset</button>
          <button type="button" id="querySave">save</button>
        </div>
      </div>

      <input
        class="sc-search"
        id="searchInput"
        type="search"
        placeholder="Search Shortcut"
        spellcheck="false"
        autocomplete="off"
      />
      <nav class="sc-tabs" id="tabs"></nav>
      <div class="sc-error" id="error" hidden></div>
      <div class="sc-list" id="list"><div class="sc-empty">...</div></div>

      <div class="wh" id="wheel" hidden>
        <div class="wh-head">
          <span class="wh-eyebrow">COME ON DOWN.</span>
          <button type="button" class="wh-close" id="wheelClose" title="Stop (Esc)">&times;</button>
        </div>
        <div class="wh-stage" id="wheelStage">
          <div class="wh-object" id="wheelObject">
            <div class="wh-shadow"></div>
            <div class="wh-stand"></div>
            <div class="wh-foot"></div>
            <div class="wh-scene">
              <div class="wh-camera">
                <div class="wh-wheel" id="drum">
                  <div class="wh-panels" id="panels"></div>
                  <div class="wh-side wh-side-back"></div>
                  <div class="wh-rim wh-rim-left"></div>
                  <div class="wh-rim"></div>
                  <div class="wh-side"><div class="wh-hub" id="hub"></div></div>
                </div>
              </div>
            </div>
            <div class="wh-highlight"></div>
            <div class="wh-pointer" id="pointer"></div>
          </div>
        </div>
        <div class="wh-caption" id="wheelStatus"></div>
        <div class="wh-story" id="wheelStory"></div>
      </div>
    </div>
    <script src="shortcut.js"></script>
  </body>
</html>
